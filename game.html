function buildSets(){const av=Object.values(G.P).filter(p=>p.owner==null&&!p.fa);const mq=[...av].sort((a,b)=>b.brand-a.brand||b.mu-a.mu).slice(0,10);const ids=new Set(mq.map(p=>p.id)),rest=av.filter(p=>!ids.has(p.id));const grp=fn=>shuffle(rest.filter(fn).map(p=>p.id));

function scoutWhy(f,pid){const A=G.au;if(!A||!['preview','lot'].includes(A.stage))return 'Scouting is only allowed during a set preview or while a lot is open';const s=A.sets[A.si];if(!s.ids.includes(pid)&&!(A.lot&&A.lot.pid===pid))return 'You can only scout players in the current set';if(f.scouted.includes(pid))return 'Already scouted';if(f.scouts>=C.scoutMax)return `All ${C.scoutMax} scouting reports used`;if(f.purse<C.scoutCost)return 'Not enough purse (0.15 Cr)';return '';}

function inc(p){for(const[t,s]of C.increments)if(p<t-1e-9)return s;return .5;}
function nextAmt(){const L=G.au.lot;return L.high==null?L.price:r2(L.price+inc(L.price));}
const reserveNeed=f=>C.reservePer*Math.max(0,C.squadMin-f.sq.length-1);
const effCost=(f,p,amt)=>amt*(f.swot==='FORTRESS'&&p.origin==='OVERSEAS'&&p.role==='PACE'?1.1:1);
function bidWhy(f,amt,p){if(f.sq.length>=C.squadMax)return 'Squad is full (25 max)';if(p.origin==='OVERSEAS'&&osCount(f)>=C.osSquad)return 'Overseas limit reached (8 per squad)';if(f.stance==='COST_LEADER'&&amt>8&&f.cl8>=2)return 'Cost Leader: max 2 players bought above 8 Cr';const left=f.purse-effCost(f,p,amt);if(left<reserveNeed(f)-1e-9)return `Reserve rule: purse after this bid (${fmt(left)} Cr) must stay ≥ ${fmt(reserveNeed(f))} Cr (0.3 Cr × slots still needed to reach 18)`;return '';}
function roleNeed(f){const c=roleCounts(f);return{WK:Math.max(0,C.minWK-c.WK),BAT:Math.max(0,C.roleMin.BAT-c.BAT-c.WK),AR:Math.max(0,C.roleMin.AR-c.AR),PACE:Math.max(0,C.roleMin.PACE-c.PACE),SPIN:Math.max(0,C.roleMin.SPIN-c.SPIN)};}

function scarFactorFor(role){return F.scarcity(sum(G.teams.map(f=>unmet(f,role))),remainingOf(role));}

function botValue(f,p){let v=estFV(f,p)*f.aggr*needMult(f,p.role);if(f.stance==='DIFFERENTIATOR'&&p.brand>=80)v*=1.2;if(f.stance==='COST_LEADER'&&v>8)v*=0.85;if(f.stance==='FOCUS'&&p.role===f.focus)v*=1.2;

function botCap(f){const slots=Math.max(1,16-f.sq.length);return(f.purse-reserveNeed(f))*clamp(2.6/slots,0.22,1);}

function openLot(pid,fm){const A=G.au,p=P(pid);const fac=scarFactorFor(p.role);const open=Math.max(0.05,r05(p.basePrice*A.cpi*(fm==='A'?0.5:1)*fac));A.lot={pid,f:fm,open,price:open,high:null,bids:[],fac,sealed:{},hp:{},pact:(A.pacts&&A.pacts[pid])||null,reveal:null};A.stage='lot';A.t=fm==='S'?C.sealTimer:C.engTimer;A.acc=0;if(fm==='S')botSealed();ping();}
function allFull(){return G.teams.every(f=>f.sq.length>=C.squadMax);}
function nextLot(){const A=G.au;if(allFull())return auEnd();const s=A.sets[A.si];A.li++;while(A.li<s.ids.length&&P(s.ids[A.li]).owner!=null)A.li++;if(A.li>=s.ids.length)return nextSet();openLot(s.ids[A.li],s.f);}

function pactBlocks(f){const L=G.au.lot;if(!L.pact||L.pact.broken)return false;const{a,b}=L.pact;return(f.id===a&&L.high===b)||(f.id===b&&L.high===a);}
function placeBid(fid,amt){const A=G.au,L=A.lot;if(pactBlocks(T(fid)))breakPact(fid);L.price=amt;L.high=fid;L.bids.push({fid,amt});A.t=C.engReset;ping();}

function proposePact(hid,bid,pid){const A=G.au;if(!A)return 'No auction';A.pacts=A.pacts||{};let L=null;

function breakPact(breaker){const L=G.au.lot;L.pact.broken=breaker;const f=T(breaker),o=T(L.pact.a===breaker?L.pact.b:L.pact.a);f.rep-=C.pactRep;f.brand-=C.pactBrand;post(f,'purse',-C.pactComp,'PENALTY',`Pact broken: compensation to ${o.name}`,'Penalties');post(o,'purse',C.pactComp,'PENALTY',`Pact compensation from ${f.name}`);f.st.pactBroken++;news(f,`${f.name} broke a non-compete pact with ${o.name}!`,"Prisoner's Dilemma",'Defection wins the round but costs reputation, brand and future cooperation.');}
function botSealed(){const L=G.au.lot,p=P(L.pid);G.teams.forEach(f=>{if(isHumanCtl(f))return;const m=botMax(f,p);if(m<L.open)return;let b=Math.max(L.open,r05(m*rf(0.75,0.95)));if(bidWhy(f,b,p))return;L.sealed[f.id]={amt:b,t:rf(0,C.sealTimer)};});}
function humanSealed(fid,amt){const A=G.au;if(!A||A.stage!=='lot'||A.lot.f!=='S')return 'No sealed-bid lot open';const L=A.lot,f=T(fid),p=P(L.pid);if(amt==null){L.hp[fid]=1;delete L.sealed[fid];}else{amt=r05(+amt);if(!(amt>=L.open-1e-9))return `Bid must be at least the opening price ${fmt(L.open)} Cr`;const w=bidWhy(f,amt,p);if(w)return w;L.sealed[fid]={amt,t:C.sealTimer-A.t};L.hp[fid]=1;}

function unsold(){const A=G.au,L=A.lot,p=P(L.pid);if(L.f==='A'){p.fa=true;G.fa.push(p.id);}else A.unsold.push(p.id);A.last={pid:p.id,fid:null,price:0,unsold:true,reveal:L.reveal};A.log.unshift({pid:p.id,fid:null,price:0,set:A.si});closePact();A.stage='sold';A.t=C.soldPause*0.6;ping();}

function rtmRaise(yes){const A=G.au,R=A.rtm,p=P(R.pid);const np=r2(R.price+inc(R.price));if(!yes||bidWhy(T(R.w),np,p)){const h=R.h,pr=R.price;A.rtm=null;return sell(h,pr);}R.price=np;R.raised=true;const h=T(R.h);if(isHumanCtl(h)){A.stage='rtmMatch';A.t=C.rtmTimer;ping();}else rtmMatch(np<=botMax(h,p)*1.05&&!bidWhy(h,np,p));}

function auFast(cond,max=4000){let i=0;while(G.phase==='AUCTION'&&!cond()&&i++<max)auTick(0.5);}
function skipLot(){const A=G.au;if(A.stage==='preview'){A.t=0;auTimeout();return;}const lot=A.lot&&A.lot.pid;auFast(()=>G.au.stage==='preview'||(G.au.lot&&G.au.lot.pid!==lot)||G.au.stage==='sold'&&G.au.t<C.soldPause-0.6);}

function repay(f,amt){amt=r2(+amt);if(!(amt>0))return 'Enter an amount to repay';if(debt(f)<=0)return 'No outstanding principal';amt=Math.min(amt,debt(f));if(f.cash<amt-1e-9)return `Not enough cash (${fmt(f.cash)} Cr) to repay ${fmt(amt)} Cr`;const x2=Math.min(f.d2,amt);f.d2=r2(f.d2-x2);f.d1=r2(f.d1-(amt-x2));post(f,'cash',-amt,'FINANCING',`Loan principal repaid: ${fmt(amt)} Cr`);ping();return '';}

/* ===================== AI: season decisions ===================== */
function bestPitchFor(f){if(f.stance==='FOCUS')return f.focus;if(f.swot==='FORTRESS')return 'SPIN';let best='BALANCED',bv=-1;Object.keys(PITCH).forEach(k=>{const xi=autoPickPs(f,k,sq(f).filter(avail));const v=sum(xi.map(p=>muEff(f,p,k,true)))*F.cf(unitsOf(xi));if(v>bv){bv=v;best=k;}});return best;}
function botPreseason(f){const ps=sq(f);const cap=ps.filter(p=>p.bcg!=='CASH_COW'||true).sort((a,b)=>b.mu-a.mu)[0];f.captain=cap?cap.id:null;const young=ps.filter(p=>p.age<25).length,rel=ps.filter(p=>cv(p)<C.reliableCV).length;f.style=young>=8?'TRANSFORMATIONAL':rel>=7?'LAISSEZ':wpick({DEMOCRATIC:2,AUTOCRATIC:1});
f.homePitch=bestPitchFor(f);if(G.diff==='HARD')ps.filter(p=>p.pricePaid>=6&&p.inj>=1.2&&!p.insured).forEach(p=>insure(f,p));if(!f.academy&&rnd()<0.35&&f.purse+f.cash>=academyCost(f)+1)buyAcademy(f);f.xi=autoPick(f,f.homePitch);botPrice(f);}
function botPrice(f){const m=curMatch(f);const xi=f.xi.map(P).filter(Boolean);const D=preDemand(f,xi.length?xi:sq(f).slice(0,11));let pr=Math.round(optimalPrice(f,D)*rf(0.9,1.1)/10)*10;if(hasSpons(f,'GREEN'))pr=Math.min(pr,C.greenCap);if(f.priceMax)pr=Math.min(pr,f.priceMax);f.price=clamp(pr,C.priceMin,ticketCap(f));}
function botRound(f){f.xi=autoPick(f,nextPitch(f));if(!f.captain||!sq(f).some(p=>p.id===f.captain)){const c=sq(f).sort((a,b)=>b.mu-a.mu)[0];f.captain=c&&c.id;}botPrice(f);if(debt(f)>0&&f.cash>6)repay(f,Math.min(debt(f),f.cash-5));}
const academyCost=f=>C.academy*(f.swot==='LEGACY'?2:1);
function buyAcademy(f){if(G.phase!=='PRESEASON')return 'The academy can only be funded in pre-season';if(f.academy)return 'Academy already funded';const c=academyCost(f);spend(f,c,'OPEX',`Academy funded (${fmt(c)} Cr)`,'Academy');f.academy=true;ping();return '';}
function setPitch(f,k){if(G.phase!=='PRESEASON')return 'Home pitch is chosen in pre-season';if(f.stance==='FOCUS')return `Focus stance: home pitch is fixed to ${f.focus}`;if(f.swot==='FORTRESS')return 'Spin Fortress: home pitch is fixed to SPIN';f.homePitch=k;ping();return '';}
function setCaptain(f,pid,style){const changing=G.phase==='TRADE';if(!['PRESEASON','TRADE'].includes(G.phase)&&!(G.phase==='LEAGUE'&&!f.captain))return 'Captain and style can only be changed in pre-season or at the trade window';if(pid&&(!P(pid)||P(pid).owner!==f.id))return 'Not your player';
if(changing&&((pid&&pid!==f.captain)||(style&&style!==f.style))){sq(f).forEach(p=>p.morale=clamp(p.morale-5,0,100));news(f,`${f.name} change leadership: squad morale −5`,'Leadership styles','Changing leaders mid-season unsettles people.');}if(pid)f.captain=pid;if(style)f.style=style;ping();return '';}
/* ===================== EVENTS ===================== */
function drawDeck(k){const key=k==='g'?'gDeck':'tDeck';if(!G[key].length)G[key]=shuffle((k==='g'?GEV:TEV).map(e=>e.id));return G[key].pop();}
function applyGlobal(id){const e=GEV.find(x=>x.id===id);G.fx.push({id,until:G.round+e.d-1});if(id==='RATE')G.rateHike+=0.03;
if(id==='RECALL')G.teams.forEach(f=>{const p=sq(f).filter(p=>p.origin==='OVERSEAS').sort((a,b)=>b.mu-a.mu)[0];if(p)p.recall=G.round+1;});
if(id==='RAIN')G.rain={r:G.round,i:ri(0,G.fixtures[G.round-1].length-1)};news(null,`MARKET EVENT: ${e.n}. ${e.x}${e.d>=99?' (rest of season)':` (${e.d} round${e.d>1?'s':''})`}`,e.c,e.t);}
function applyTeamEvent(f,id){const e=TEV.find(x=>x.id===id),ps=sq(f);const pend=(data,opts,botK)=>{if(isHumanCtl(f))G.pend.push({id:++G.pendSeq,fid:f.id,ev:id,data,opts});else resolveEvent(f,id,data,botK);};
switch(id){case'INJ':{const p=ps.filter(avail).sort((a,b)=>trueFV(b)-trueFV(a))[0];if(!p)return;injure(f,p,3,true);break;}
case'VIRAL':f.brand+=6;break;
case'CONTRO':{const p=pick(ps);if(!p)return;const top=ps.sort((a,b)=>b.mu-a.mu).slice(0,5).includes(p);pend({pid:p.id},[['SUSPEND',`Suspend ${p.name} for 2 matches (brand −3)`],['STAND',`Stand by him (brand −6)`]],top?'STAND':'SUSPEND');break;}
case'DISPUTE':{const c=ps.filter(p=>p.bcg==='CORE'||p.bcg==='STAR');if(!c.length)return;const p=pick(c);pend({pid:p.id},[['PAY',`Pay ${p.name} 0.5 Cr (morale +15)`],['REFUSE','Refuse (morale −25)']],trueFV(p)>=6?'PAY':'REFUSE');break;}
case'POACH':{const s=activeSpons(f);if(!s.length)return;const k=pick(s).k;pend({k},[['CUT',`Accept a 20% cut on ${SPONS[k].n}'s remaining fee`],['LOSE',`Let ${SPONS[k].n} leave (brand −3)`]],'CUT');break;}
case'DATA':{const t=Object.values(G.P).filter(p=>p.owner!=null&&p.owner!==f.id&&!f.scouted.includes(p.id)).sort((a,b)=>trueFV(b)-trueFV(a)).slice(0,3);t.forEach(p=>f.scouted.push(p.id));news(f,`Data partner revealed exact μ/σ for ${t.map(p=>p.name).join(', ')}`,e.c,e.t);break;}
case'STADIUM':{const left=G.fixtures.slice(G.round-1).filter(ms=>ms.some(m=>m.h===f.id)).length;pend({left},[['BUILD',`Pay 4 Cr for +5,000 seats (${left} home matches left)`],['SKIP','Decline']],left>=4&&f.cash>=4?'BUILD':'SKIP');break;}
case'BOYCOTT':{if(f.lastPrice>3000){pend({},[['CUT','Cut next home ticket price below ₹2,000 to cancel'],['RIDE','Ride it out (next home attendance ×0.7)']],'CUT');}else{news(f,`${f.name}: fan boycott threat fizzles (last price ₹${f.lastPrice||0} ≤ ₹3,000)`,e.c,e.t);return;}break;}
case'BREAK':{const q=ps.filter(p=>p.bcg==='QUESTION_MARK').sort((a,b)=>b.pot-a.pot)[0];if(!q)return;q.mu+=6;break;}
case'EQUITY':pend({},[['ACCEPT','Take 10 Cr now; investor owns 8% of final valuation'],['DECLINE','Decline']],(f.cash<0||debt(f)>15)?'ACCEPT':'DECLINE');break;}
news(f,`TEAM EVENT (${f.name}): ${e.n}`,e.c,e.t);}
function resolveEvent(f,id,d,k){switch(id){
case'CONTRO':{const p=P(d.pid);if(p){p.morale=clamp(p.morale-20,0,100);if(k==='SUSPEND')p.susp=2;}f.brand-=k==='SUSPEND'?3:6;break;}
case'DISPUTE':{const p=P(d.pid);if(!p)break;if(k==='PAY'){post(f,'cash',-0.5,'OPEX',`Contract dispute settled: ${p.name}`,'Retention');p.morale=clamp(p.morale+15,0,100);}else p.morale=clamp(p.morale-25,0,100);break;}
case'POACH':{const s=f.spons.find(x=>x.k===d.k&&x.act);if(!s)break;if(k==='CUT'){s.per*=0.8;s.note='fee cut 20% (poach)';}else exitSponsor(f,s,'poached by a rival');break;}
case'STADIUM':if(k==='BUILD'){post(f,'cash',-4,'CAPEX','Stadium upgrade: +5,000 seats');f.cap+=5000;}break;
case'BOYCOTT':if(k==='CUT')f.priceMax=1990;else f.boycott=true;break;
case'EQUITY':if(k==='ACCEPT'){post(f,'cash',10,'FINANCING','Equity investor: 10 Cr for 8% of final valuation');f.investor=true;}break;
case'ATTR':{const p=P(d.pid);if(!p||p.owner!==f.id)break;if(k==='GRANT'){releaseP(f,p);news(f,`${p.name} released at his request; ${fmt(p.pricePaid)} Cr stays sunk`,'Attrition','');}else if(k==='RETAIN'){post(f,'cash',-C.retainBonus,'OPEX',`Retention bonus: ${p.name}`,'Retention');p.morale=clamp(p.morale+20,0,100);}else f.refused.push(p.id);break;}}ping();}
function resolvePend(pid,k){const i=G.pend.findIndex(x=>x.id===pid);if(i<0)return 'Already resolved';const x=G.pend[i];if(x.ev==='ATTR'&&k==='GRANT'&&T(x.fid).sq.length<=C.squadMin)return 'Cannot grant the release: squad would fall below 18';G.pend.splice(i,1);resolveEvent(T(x.fid),x.ev,x.data,k);return '';}
function attrition(f){sq(f).forEach(p=>{if(p.morale>=30||f.refused.includes(p.id)||G.pend.some(x=>x.ev==='ATTR'&&x.data.pid===p.id))return;if(isHumanCtl(f)){G.pend.push({id:++G.pendSeq,fid:f.id,ev:'ATTR',data:{pid:p.id},opts:[['GRANT',`Grant release (${fmt(p.pricePaid)} Cr stays sunk)`],['REFUSE','Refuse (squad morale −3 per round while he stays below 30)'],['RETAIN','Retain: pay 0.2 Cr, his morale +20']]});news(f,`${p.name} has requested a release (morale ${p.morale})`,'Attrition and retention','Hygiene factors that fall too low drive people out.');}
else resolveEvent(f,'ATTR',{pid:p.id},trueFV(p)>=5?'RETAIN':f.sq.length>C.squadMin?'GRANT':'RETAIN');});}
/* ===================== LEAGUE LOOP (Section 14.5) ===================== */
function startSeasonWhy(){for(const f of G.teams.filter(isHumanCtl)){if(!f.captain)return `${f.name}: pick a captain`;if(!f.style)return `${f.name}: pick a leadership style`;}return '';}
function startSeason(){const w=startSeasonWhy();if(w)return w;G.teams.forEach(f=>{f.pl={};});G.phase='LEAGUE';G.round=0;beginRound();return '';}
function beginRound(){G.round++;G.rs='plan';G.fx=G.fx.filter(x=>x.until>=G.round);G.rain=null;G.teams.forEach(f=>f.pl={});
if(rnd()<C.globalChance)applyGlobal(drawDeck('g'));G.teams.forEach(f=>{if(rnd()<C.teamChance)applyTeamEvent(f,drawDeck('t'));});
if(G.round===4)G.teams.forEach(f=>{if(f.swot==='FORTRESS'&&!hasSpons(f,'SAHYOG')&&!f.offers.includes('SAHYOG')){f.offers.push('SAHYOG');news(f,`${f.name}: Sahyog Bank regional sponsor offer`,'SWOT','');if(!isHumanCtl(f))botSponsors(f);}});
G.teams.forEach(f=>{if(!isHumanCtl(f))botRound(f);else{const ids=f.xi.filter(id=>P(id)&&P(id).owner===f.id);if(xiWhy(f,ids))f.xi=autoPick(f,nextPitch(f));f.price=clamp(f.price,C.priceMin,ticketCap(f));if(f.priceMax)f.price=Math.min(f.price,f.priceMax);}});ping();}
function roundWhy(){if(G.pend.length){const x=G.pend[0];return `${T(x.fid).name}: resolve the pending decision in the News/Play tab first`;}for(const f of G.teams.filter(isHumanCtl)){const w=xiWhy(f,f.xi);if(w)return `${f.name}: ${w}`;if(!f.captain||!sq(f).some(p=>p.id===f.captain))return `${f.name}: pick a captain from your squad`;}return '';}
function playRound(){if(G.phase!=='LEAGUE'||G.rs!=='plan')return 'Round already played';const w=roundWhy();if(w)return w;const ms=G.fixtures[G.round-1],res=[];
ms.forEach((mt,i)=>{res.push(G.rain&&G.rain.r===G.round&&G.rain.i===i?abandon(mt):simMatch(mt.h,mt.a,{}));});
const busy=new Set(ms.flatMap(m=>[m.h,m.a]));G.teams.filter(f=>!busy.has(f.id)).forEach(f=>sq(f).forEach(p=>{p.stamina=clamp(p.stamina+25,0,100);if(p.status==='INJURED'){p.out--;if(p.out<=0){p.status='AVAILABLE';p.out=0;}}}));
G.results.push({r:G.round,ms:res});endRound();G.rs='done';ping();return '';}
function endRound(){const R=G.R;G.teams.forEach(f=>{post(f,'cash',fxOn('BOOM')?C.broadcastBoom:C.broadcast,'REVENUE','Central broadcast pool','Broadcast');const cc=sq(f).filter(p=>p.bcg==='CASH_COW').length;if(cc)post(f,'cash',cc*C.ccMerch,'REVENUE',`Cash Cow merch (${cc} players)`,'Merch');
f.spons.forEach(s=>{if(s.act&&s.left>0){post(f,'cash',s.per,'REVENUE',`${SPONS[s.k].n} fee instalment`,'Sponsors');s.left--;s.paid+=s.per;}});
const over=Math.max(0,f.sq.length-C.carryAbove);if(over)post(f,'cash',-over*C.carry*opx(),'OPEX',`Carrying cost: ${over} player(s) above ${C.carryAbove}`,'Carrying');
let it=(f.d1*rate(f,1)+f.d2*rate(f,2))/R;if(f.cash<0)it+=-f.cash*(C.overdraftRate+G.rateHike)/R;if(it>1e-9){post(f,'int',it,'INTEREST',`Interest accrued${f.cash<0?' (incl. overdraft on negative cash)':''}`,'Interest');f.st.intPaid+=it;}
const ps=sq(f);if(f.capOn&&f.style==='AUTOCRATIC')ps.forEach(p=>p.morale-=1);if(f.capOn&&f.style==='DEMOCRATIC')ps.forEach(p=>p.morale+=2);if(f.cash<0)ps.forEach(p=>p.morale-=3);
f.refused=f.refused.filter(id=>P(id)&&P(id).owner===f.id&&P(id).morale<30);if(f.refused.length)ps.forEach(p=>p.morale-=3*f.refused.length);ps.forEach(p=>p.morale=clamp(Math.round(p.morale),0,100));
attrition(f);f.st.peakDebt=Math.max(f.st.peakDebt,debt(f));});retagAll();
if(G.round===G.mid){G.teams.forEach(f=>{const s=f.spons.find(x=>x.k==='CHRONOS'&&x.act);if(s){if(sq(f).filter(p=>p.bcg==='STAR').length>=3){post(f,'cash',2,'REVENUE','Chronos bonus: 3 STARs at mid-season','Sponsors');s.note='bonus paid';}else exitSponsor(f,s,'fewer than 3 STARs at mid-season');}covenant(f);});}
if(G.round===G.R)G.teams.forEach(covenant);G.teams.forEach(f=>{f.brand=clamp(f.brand,0,100);f.rep=clamp(f.rep,0,100);f.lastPL={...f.pl};f.plHist.push({r:G.round,pl:{...f.pl}});});}
function advance(){if(G.phase==='LEAGUE'&&G.rs==='done'){if(G.round===G.mid&&!G.tradeDone)return openTrade();if(G.round<G.R)return beginRound();return startPlayoffs();}}
/* ===================== TRADE WINDOW (Section 11) ===================== */
function openTrade(){G.phase='TRADE';G.tradeDone=true;G.tr={inbox:[],log:[]};G.teams.forEach(f=>{f.props=0;const k=shuffle(Object.keys(SPONS).filter(x=>!f.spons.some(s=>s.k===x)&&!f.offers.includes(x)))[0];if(k)f.offers.push(k);
if(f.academy&&!f.gradDone&&f.sq.length<C.squadMax){f.gradDone=true;const p=genPlayer({capped:false,age:19,os:false,mu:ri(25,35),pot:ri(20,30),brand:ri(10,30),homeState:f.state,academy:true});p.tags=['REGIONAL','YOUTH'];p.owner=f.id;p.pricePaid=0;f.sq.push(p.id);p.bcg=bcgOf(p);news(f,`${f.name} academy graduate joins: ${p.name}`,'Succession planning','A talent pipeline lowers future hiring cost.');}});
G.teams.filter(f=>!isHumanCtl(f)).forEach(f=>{botSponsors(f);botWindow(f);});news(null,'Trade window open','Negotiation and BATNA','Know your walk-away value before you negotiate.');ping();}
function dealWhy(d){const A=T(d.from),B=T(d.to);if(!d.give.length&&!d.get.length)return 'Add at least one player to the deal';if(d.give.some(id=>!P(id)||P(id).owner!==A.id)||d.get.some(id=>!P(id)||P(id).owner!==B.id))return 'A player in this deal has moved';
if(d.type==='LOAN'&&d.give.length+d.get.length!==1)return 'A loan transfer moves exactly one player';
for(const[f,out,inn]of[[A,d.give,d.get],[B,d.get,d.give]]){const ids=f.sq.filter(x=>!out.includes(x)).concat(inn),ps=ids.map(P);if(ids.length<C.squadMin)return `${f.name} would fall below 18 players`;if(ids.length>C.squadMax)return `${f.name} would exceed 25 players`;if(ps.filter(p=>p.origin==='OVERSEAS').length>C.osSquad)return `${f.name} would exceed 8 overseas players`;if(ps.filter(p=>p.role==='WK').length<C.minWK)return `${f.name} would have fewer than 2 wicketkeepers`;}
if(d.cash>0&&A.cash<d.cash-1e-9)return `${A.name} lack the cash (${fmt(A.cash)} Cr)`;if(d.cash<0&&B.cash<-d.cash-1e-9)return `${B.name} lack the cash (${fmt(B.cash)} Cr)`;return '';}
function bottleneck(f){const ids=f.xi.length===11?f.xi:autoPick(f,f.homePitch);const u=unitsOf(ids.map(P).filter(Boolean));return UNITS[u.indexOf(Math.min(...u))];}
function sideValue(f,inIds,outIds,frac){const bn=bottleneck(f);let vin=sum(inIds.map(id=>{const p=P(id);return estFV(f,p)*(bestUnit(p)===bn?1.2:1);}))*frac;if(f.sq.length-outIds.length+inIds.length>22)vin*=0.8;return{vin,vout:sum(outIds.map(id=>trueFV(P(id))))*frac};}
function evalDeal(d){const A=T(d.from),B=T(d.to);const frac=d.type==='LOAN'?(G.R-G.round)/G.R:1;const{vin,vout}=sideValue(B,d.give,d.get,frac);const vr=vin+Math.max(0,d.cash),vg=vout+Math.max(0,-d.cash);const prem=Math.max(0,0.10+(70-A.rep)*0.005);return{vr,vg,req:vg*(1+prem),prem,ok:A.rep>=50&&vr>=vg*(1+prem)};}
function batna(f,d,mine){const out=mine?d.give:d.get,inn=mine?d.get:d.give;const frac=d.type==='LOAN'?(G.R-G.round)/G.R:1;const{vin,vout}=sideValue(f,inn,out,frac);return{give:vout,get:vin};}
function execDeal(d){const A=T(d.from),B=T(d.to);const mv=(ids,src,dst)=>ids.forEach(id=>{const p=P(id);src.sq=src.sq.filter(x=>x!==id);src.xi=src.xi.filter(x=>x!==id);if(src.captain===id)src.captain=null;dst.sq.push(id);if(d.type==='LOAN'){p.loanFrom=src.id;}else{p.loanFrom=null;p.pricePaid=d.type==='SALE'&&ids.length===1&&d.cash!==0?Math.abs(d.cash):r2(trueFV(p));}p.owner=dst.id;p.sunkRun=0;});
mv(d.give,A,B);mv(d.get,B,A);if(d.cash){const cat=d.type==='LOAN'?'Trade':null;post(A,'cash',-d.cash,'TRADE',`${d.type==='LOAN'?'Loan fee':'Trade cash'} ${d.cash>0?'to':'from'} ${B.name}`,cat);post(B,'cash',d.cash,'TRADE',`${d.type==='LOAN'?'Loan fee':'Trade cash'} ${d.cash>0?'from':'to'} ${A.name}`,cat);}
G.tr.log.unshift({...d,done:true});news(A,`TRADE: ${A.name} ⇄ ${B.name}: ${dealText(d)}`,'Negotiation and BATNA','Both sides accept only if they value what they get above what they give.');retagAll();ping();}
function dealText(d){const n=ids=>ids.map(id=>P(id).name).join(', ')||'nothing';return `${T(d.from).code} give ${n(d.give)}${d.cash>0?` + ${fmt(d.cash)} Cr`:''}; ${T(d.to).code} give ${n(d.get)}${d.cash<0?` + ${fmt(-d.cash)} Cr`:''}${d.type==='LOAN'?' (loan to playoffs)':''}`;}
function proposeDeal(d){const A=T(d.from),B=T(d.to);if(G.phase!=='TRADE')return{err:'Trades only happen in the trade window'};if(isHumanCtl(A)&&A.props>=C.tradeMaxHuman)return{err:`Max ${C.tradeMaxHuman} proposals per window`};const w=dealWhy(d);if(w)return{err:w};if(isHumanCtl(A))A.props++;d.id=++G.dealSeq;d.n=d.n||0;
if(isHumanCtl(B)){G.tr.inbox.push(d);ping();return{msg:`Offer sent to ${B.name}`};}const e=evalDeal(d);if(e.ok){execDeal(d);return{msg:`${B.name} accepted!`,ok:true};}
if(A.rep<50)return{msg:`${B.name} rejected: your reputation is below 50`};if(e.vr>=0.75*e.req&&d.n<C.maxCounters){const c={...d,give:[...d.give],get:[...d.get],cash:r2(d.cash+Math.ceil((e.req-e.vr)*10)/10),n:d.n+1,counter:true};if(!dealWhy(c)){c.id=++G.dealSeq;G.tr.inbox.push({...c,from:d.from,to:d.to,fromBot:B.id});ping();return{msg:`${B.name} countered: they want ${fmt(Math.abs(c.cash))} Cr ${c.cash>=0?'from you':'(less cash to you)'}`};}}
return{msg:`${B.name} rejected the offer (they value what they give at ${fmt(e.vg)} Cr vs ${fmt(e.vr)} Cr received)`};}
function respondDeal(id,act,cash){const i=G.tr.inbox.findIndex(x=>x.id===id);if(i<0)return{err:'Offer no longer available'};const d=G.tr.inbox[i];
if(act==='reject'){G.tr.inbox.splice(i,1);ping();return{msg:'Rejected'};}
if(act==='accept'){const w=dealWhy(d);if(w)return{err:w};G.tr.inbox.splice(i,1);execDeal(d);return{msg:'Deal done',ok:true};}
if(act==='counter'){if(d.n>=C.maxCounters){G.tr.inbox.splice(i,1);return{err:'Max 3 counters reached: the deal is closed'};}G.tr.inbox.splice(i,1);
if(d.counter){return proposeDeal({from:d.from,to:d.to,give:d.give,get:d.get,cash:r2(+cash),type:d.type,n:d.n});}
return proposeDeal({from:d.to,to:d.from,give:d.get,get:d.give,cash:r2(-(+cash)),type:d.type,n:d.n+1});}return{err:'Unknown action'};}
function botWindow(f){const nProp=ri(1,2);for(let k=0;k<nProp;k++){const bn=bottleneck(f);const cands=Object.values(G.P).filter(p=>p.owner!=null&&p.owner!==f.id&&bestUnit(p)===bn&&T(p.owner).captain!==p.id&&!p.loanFrom&&trueFV(p)>=2).sort((a,b)=>b.units[bn]-a.units[bn]);
for(const p of cands.slice(0,4)){const price=r2(trueFV(p)*rf(1.05,1.25));if(price>f.cash-2)continue;const d={from:f.id,to:p.owner,give:[],get:[p.id],cash:price,type:'SALE'};if(f.sq.length>=22){const surplus=sq(f).filter(x=>x.role===p.role&&x.id!==f.captain).sort((a,b)=>trueFV(a)-trueFV(b))[0];if(surplus){d.give=[surplus.id];d.type='SWAP';d.cash=r2(Math.max(0,price-trueFV(surplus)));}}

sq(f).filter(p=>p.bcg==='DOG'&&f.sq.length>22&&p.id!==f.captain).forEach(p=>{if(!releaseWhy(f,p))sellToFA(f,p);});}
function releaseWhy(f,p){if(p.owner!==f.id)return 'Not your player';if(p.loanFrom!=null)return 'Loaned players cannot be released';const ids=f.sq.filter(x=>x!==p.id),ps=ids.map(P);if(ids.length<C.squadMin)return 'Release blocked: the squad would fall below 18 players';if(ps.filter(x=>x.role==='WK').length<C.minWK)return 'Release blocked: you need at least 2 wicketkeepers';return '';}
function releaseP(f,p){f.sq=f.sq.filter(x=>x!==p.id);f.xi=f.xi.filter(x=>x!==p.id);if(f.captain===p.id)f.captain=null;p.owner=null;p.status=p.status==='INJURED'?'INJURED':'AVAILABLE';p.fa=true;p.insured=false;p.released=true;if(!G.fa.includes(p.id))G.fa.push(p.id);f.refused=f.refused.filter(x=>x!==p.id);}
function release(f,pid){const p=P(pid),w=releaseWhy(f,p);if(w)return w;releaseP(f,p);news(f,`${f.name} release ${p.name}: ${fmt(p.pricePaid)} Cr stays sunk`,'Sunk cost fallacy','What you paid is gone either way; only future value matters.');ping();return '';}
function sellToFA(f,p){if(G.phase!=='TRADE')return 'Free agent sales only happen in the trade window';const w=releaseWhy(f,p);if(w)return w;const v=r2(C.faSalePct*trueFV(p));releaseP(f,p);post(f,'cash',v,'TRADE',`Sold ${p.name} to free agent pool (40% of Fair Value)`,'Trade');ping();return '';}
const faPrice=p=>r2(p.basePrice*(G.au?G.au.cpi:1));

function closeTrade(){G.teams.filter(f=>!isHumanCtl(f)).forEach(f=>{const n=roleNeed(f);ROLES.forEach(r=>{if(n[r]>0){const p=G.fa.map(P).filter(x=>x.role===r&&x.status==='AVAILABLE').sort((a,b)=>b.mu-a.mu)[0];if(p)signFA(f,p.id);}});});
G.tr.inbox=[];G.phase='LEAGUE';news(null,'Trade window closed','Negotiation','');beginRound();ping();}
/* ===================== PLAYOFFS + FINAL SCORING ===================== */
function startPlayoffs(){G.teams.forEach(f=>{sq(f).filter(p=>p.loanFrom!=null).forEach(p=>{const o=T(p.loanFrom);f.sq=f.sq.filter(x=>x!==p.id);f.xi=f.xi.filter(x=>x!==p.id);if(f.captain===p.id)f.captain=null;o.sq.push(p.id);p.owner=o.id;p.loanFrom=null;});if(!f.captain){const c=sq(f).sort((a,b)=>b.mu-a.mu)[0];f.captain=c&&c.id;}});
const st=standings(),top=st.slice(0,4).map(f=>f.id);G.teams.forEach(f=>{const q=top.includes(f.id);if(q)f.brand=clamp(f.brand+5,0,100);const s=f.spons.find(x=>x.k==='NOVA'&&x.act);if(s){if(q){post(f,'cash',6,'REVENUE','NovaPay bonus: qualified for playoffs','Sponsors');s.note='bonus paid';}else{const cl=r2(s.fee*0.5);post(f,'cash',-cl,'PENALTY','NovaPay fee cut to 6 Cr: missed playoffs','Penalties');s.note='fee cut';}}f.pl={};});
G.phase='PLAYOFFS';G.po={seeds:top,i:0,ms:[],w:{},l:{}};news(null,`Playoffs: ${top.map(id=>T(id).name).join(', ')}`,'Brand equity','Qualifying adds brand +5 for each playoff team.');G.teams.forEach(f=>{if(!isHumanCtl(f))f.xi=autoPick(f,'BALANCED');});ping();}
const PO_ST=[['Q1','Qualifier 1'],['EL','Eliminator'],['Q2','Qualifier 2'],['F','Final']];
function poPair(i){const s=G.po.seeds,W=G.po.w,L=G.po.l;return[[s[0],s[1]],[s[2],s[3]],[L.Q1,W.EL],[W.Q1,W.Q2]][i];}
function playPlayoff(){const po=G.po;if(po.i>=4)return 'Playoffs complete';for(const f of G.teams.filter(isHumanCtl)){const ids=f.xi.filter(id=>P(id)&&P(id).owner===f.id);if(poPair(po.i).includes(f.id)&&xiWhy(f,ids))f.xi=autoPick(f,'BALANCED');}
const[k,lab]=PO_ST[po.i],[a,b]=poPair(po.i);G.teams.forEach(f=>{if(!isHumanCtl(f)&&(f.id===a||f.id===b))f.xi=autoPick(f,'BALANCED');});const m=simMatch(a,b,{playoff:true,label:lab});po.ms.push(m);po.w[k]=m.w;po.l[k]=m.l;po.i++;
if(po.i===4){const pay=(id,amt,l,pre)=>{const f=T(id);post(f,'cash',amt,'PRIZE',l,'Prize');f.prestige=pre;};pay(po.w.F,C.prize.CHAMP,'Prize money: Champion',C.prestige.CHAMP);pay(po.l.F,C.prize.RUNNER,'Prize money: Runner-up',C.prestige.RUNNER);pay(po.l.Q2,C.prize.Q2,'Prize money: Qualifier 2 loser',C.prestige.Q2);pay(po.l.EL,C.prize.ELIM,'Prize money: Eliminator loser',C.prestige.ELIM);T(po.w.F).brand=clamp(T(po.w.F).brand+10,0,100);news(T(po.w.F),`${T(po.w.F).name} are CHAMPIONS!`,'Brand equity','Winning the title adds brand +10, but valuation decides the game.');}ping();return '';}
function squadValue(f){return sum(sq(f).map(trueFV));}
function finalize(){G.teams.forEach(f=>{if(f.purse){f.ledger.push({r:G.round,s:G.season,ph:'RESULTS',l:`Unspent purse added to cash (${fmt(f.purse)} Cr)`,a:f.purse,t:'CAPEX',k:'cash'});f.cash+=f.purse;f.leftPurse=f.purse;f.purse=0;}
f.spons.filter(s=>s.act).forEach(s=>{if(s.k==='SAHYOG'){const a=f.localN?f.localSum/f.localN:0;if(a>=5){post(f,'cash',1,'REVENUE',`Sahyog bonus: avg ${fmt(a,1)} local players`,'Sponsors');s.note='bonus paid';}else if(a<3){post(f,'cash',-r2(s.fee*0.5),'PENALTY',`Sahyog clawback: avg ${fmt(a,1)} local players < 3`,'Penalties');s.note='50% repaid';}}
if(s.k==='LEARN'){const ok=Object.entries(f.qmApps).some(([id,n])=>n>=10&&P(id)&&P(id).bcg==='STAR');if(ok){post(f,'cash',2,'REVENUE','LearnLeap bonus: Question Mark became a STAR','Sponsors');s.note='bonus paid';}}if(s.k==='GREEN'){f.brand=clamp(f.brand+4,0,100);s.note='brand +4';}});});
G.teams.forEach(f=>f.brand=clamp(f.brand,0,100));const st=standings();st.slice(-3).forEach(f=>{if(f.swot==='CASHRICH'){f.brand=clamp(f.brand-5,0,100);news(f,`${f.name}: media scrutiny for a bottom 3 finish, brand −5`,'SWOT','');}});
const q=G.teams.filter(f=>f.st.cvN>0).sort((a,b)=>a.st.cvSum/a.st.cvN-b.st.cvSum/b.st.cvN)[0];G.teams.forEach(f=>f.award=0);if(q){q.award=C.qualityAward;news(q,`${q.name} win the Six Sigma Quality Award (+3 Cr valuation)`,'Six Sigma','Consistency (low CV) is a measurable quality.');}
G.final=G.teams.map(f=>{const sqv=squadValue(f),d=debt(f)+f.intAcc;const v=F.valuation({cash:f.cash,stance:f.stance,squad:sqv,brand:f.brand,points:f.pts,prestige:f.prestige,awards:f.award,debt:d,investor:f.investor});return{id:f.id,cash:f.cash,cashC:v.cashC,squad:sqv,brandV:v.brandV,perf:v.perf,awards:f.award,debt:d,investor:f.investor,fv:v.fv};}).sort((a,b)=>b.fv-a.fv||T(b.id).pts-T(a.id).pts||a.debt-b.debt||T(b.id).brand-T(a.id).brand);
G.hist.push({season:G.season,champ:G.po.w.F,ranks:G.final.map(x=>({id:x.id,fv:r2(x.fv)}))});G.phase='RESULTS';news(T(G.final[0].id),`${T(G.final[0].id).name} win Franchise CFO with FV ${fmt(G.final[0].fv)} Cr`,'Valuation','The most valuable franchise wins, not the best team.');ping();}

['Winner\'s curse','Total overpay vs Fair Value',fmt(s.overpay)+' Cr'],['Information asymmetry','Scouting spend',fmt(s.scoutSpend)+' Cr'],['Options (time decay)','RTM premiums expired',fmt(s.rtmExp)+' Cr'],['Hedging','Insurance premiums vs payouts',`${fmt(ins)} vs ${fmt(pays)} Cr`],['Leverage','Peak debt / interest accrued',`${fmt(s.peakDebt)} / ${fmt(s.intPaid)} Cr`],['Price elasticity','Avg ticket price vs optimal',s.homeN?`₹${Math.round(s.priceSum/s.homeN)} vs ₹${Math.round(s.optSum/s.homeN)}`:'n/a'],['Brand equity','Brand change',`${Math.round(s.brand0)} → ${Math.round(f.brand)}`],["Prisoner's Dilemma",'Pacts kept vs broken',`${s.pactKept} / ${s.pactBroken}`],['Sunk cost fallacy','Sunk cost starts',String(s.sunk)],['Theory of Constraints','Matches with a binding bottleneck (CF < 0.97)',String(s.bottle)],['BCG Matrix','Question Marks converted',String(s.qmConv)],['Squad composition','Auto-fill replacements',String(s.autofill)],['Six Sigma','Average CV of XI appearances',s.cvN?fmt(s.cvSum/s.cvN,3):'n/a']];}

function newSeason(ret={}){G.season++;G.teams.forEach(f=>{const profit=sum(Object.values(f.spl));const keep=(isHumanCtl(f)?(ret[f.id]||[]):botRetain(f)).slice(0,C.retentionMax).filter(id=>P(id)&&P(id).owner===f.id);const cost=sum(keep.map(id=>retPrice(P(id))));
sq(f).filter(p=>!keep.includes(p.id)).forEach(p=>{p.owner=null;p.fa=false;p.insured=false;});f.sq=keep.slice();f.purse=r2(C.purse-cost+Math.max(0,profit)*C.profitShare);f.ledger.push({r:0,s:G.season,ph:'STRATEGY',l:`New season purse: 120 − retention ${fmt(cost)} + 10% of profit ${fmt(Math.max(0,profit))}`,a:f.purse,t:'CAPEX',k:'purse'});
Object.assign(f,{pts:0,w:0,l:0,nr:0,margin:0,h2h:{},res:[],xi:[],spons:[],offers:shuffle(Object.keys(SPONS)).slice(0,2),rtm:0,scouted:[],scouts:0,cl8:keep.filter(id=>P(id).pricePaid>8).length,academy:false,gradDone:false,pl:{},spl:{},lastPL:null,plHist:[],rev:0,prestige:0,award:0,covBreach:0,t2:true,scores:[],localSum:0,localN:0,qmApps:{},props:0,refused:[],ready:!f.isHuman,boycott:false,priceMax:0,dscr:null,cap:f.swot==='METRO'?C.metroCapacity:C.capacity});
f.st={overpay:0,scoutSpend:0,rtmPrem:0,rtmExp:0,insPrem:0,insPay:0,peakDebt:debt(f),intPaid:0,priceSum:0,optSum:0,homeN:0,brand0:f.brand,pactKept:0,pactBroken:0,sunk:0,bottle:0,qmConv:0,autofill:0,cvSum:0,cvN:0,bought:0};if(f.captain&&!keep.includes(f.captain))f.captain=null;});
Object.values(G.P).forEach(p=>{p.age++;if(p.bcg==='QUESTION_MARK')p.mu=Math.min(p.startMu+p.pot,p.mu+ri(2,6));Object.assign(p,{form:1,stamina:100,morale:C.moraleStart,status:'AVAILABLE',out:0,susp:0,recall:0,bench:0,sunkRun:0});if(p.owner==null&&!p.auto){p.fa=false;p.basePrice=basePriceFor(p.brand,p.capped);}if(p.auto&&p.owner==null)p.fa=true;});
G.fa=Object.values(G.P).filter(p=>p.owner==null&&p.fa).map(p=>p.id);for(let i=0;i<C.newTalentPerSeason;i++)genPlayer({capped:false});retagAll();

t('fairValue(μ70, inj1.0, brand90)',F.fairValue(70,1,90),15.12);t('scarcityFactor(unmet 11, remaining 8)',F.scarcity(11,8),1.15);t('muEff Section 13.2 spinner',F.muEff(45,1.05,70,80,1.10,1.03,1),56.75,0.01);

<div class="row mt"><button class="btn pri big" data-a="start">Start new game</button>${hasSave()?'<button class="btn big" data-a="continue">Continue saved game</button>':''}<button class="btn ghost" data-a="import">Import save</button></div></div>

return `<div class="card mb"><div class="row sp"><div><h2>${tname(f)} · Strategy room</h2><span class="mu">${hs.length>1?`Hotseat: player ${idx} of ${hs.length} is choosing. Others look away!`:'Commit to a strategy before a single bid. These choices lock in bonuses and penalties.'}</span></div><button class="btn pri big" data-a="confirmStrat">Confirm strategy ➜</button></div></div>

function tMax(A){return A.stage==='preview'?C.previewTimer:A.stage==='lot'?(A.lot.f==='S'?C.sealTimer:(A.lot.high==null?C.engTimer:C.engReset)):A.stage==='sold'?C.soldPause:C.rtmTimer;}

function rtmPrompt(A){const R=A.rtm;if(!R)return '';const p=P(R.pid);let out='';humans().forEach(h=>{if(h.auto)return;if(A.stage==='rtm'&&R.holders.includes(h.id)&&R.cands[h.id]===undefined)out+=`<div class="prompt"><b>${tname(h)}: exercise Right to Match?</b><p>${esc(p.name)} went to ${tname(T(R.w))} at <b>${fmt(R.price)} Cr</b>. Your RTM call option lets you buy him at that strike price.</p><div class="row"><button class="btn pri" data-a="rtmY" data-fast="1" data-v="${h.id}">Exercise RTM</button><button class="btn" data-a="rtmN" data-fast="1" data-v="${h.id}">Let it go</button></div></div>`;

<div class="tw"><table><tr><th>Player</th><th>Role</th><th>Origin</th><th>Age</th><th><span class="lc">μ band</span></th><th>Brand</th><th>Base</th><th>Est. FV</th><th></th></tr>${s.ids.map(P).filter(p=>p.owner==null).map(p=>`<tr><td>${esc(p.name)} ${p.homeState===f.state?'<span class="tag ok">Local</span>':''}</td><td>${roleT(p.role)}</td><td>${p.origin==='OVERSEAS'?'<span class="tag os">OS</span>':'Dom'}</td><td>${p.age}</td><td>${muTxt(f,p)}${knows(f,p)?` <small>σ ${p.sigma} · inj ${p.inj}</small>`:''}</td><td>${p.brand}</td><td>${fmt(p.basePrice*A.cpi*(s.f==='A'?.5:1))}</td><td>${fmt(estFV(f,p))}</td><td class="row" style="flex-wrap:nowrap">${f.isHuman&&!knows(f,p)?`<button class="btn sm" data-a="scout" data-v="${p.id}">Scout</button>`:''}${f.isHuman&&s.f!=='S'?((A.pacts||{})[p.id]?`<span class="tag warn">pact ${T(A.pacts[p.id].b).code}</span>`:`<button class="btn sm ghost" data-a="pact" data-v="${p.id}" data-tip="Propose a non-compete pact on this player">🤝</button>`):''}</td></tr>`).join('')}</table></div></div>`;}
else if(A.lot){const L=A.lot,p=P(L.pid);let mid='';
if(A.stage==='sold'&&A.last){const l=A.last;mid=`<div class="sold ${l.unsold?'uns':''}"><h2>${l.unsold?'UNSOLD':'SOLD'}</h2>${l.unsold?`<p>${L.f==='A'?'Moves to the free agent pool':'Moves to the accelerated round'}</p>`:`<p>to ${tname(T(l.fid))} for <b>${fmt(l.price)} Cr</b>${l.rtm?' <span class="tag warn">via RTM</span>':''}</p>`}</div>${l.reveal&&l.reveal.length?`<div class="mt"><h4>All sealed bids revealed</h4><div class="ladder">${l.reveal.map((b,i)=>`<div><span>${i+1}. ${tchip(T(b.fid))} ${esc(T(b.fid).name)}</span><b>${fmt(b.amt)} Cr</b></div>`).join('')}</div><p class="mu">${G.vickrey?'Vickrey rule: winner pays the second highest bid.':'First price: winner pays own bid. Spread between bids shows the winner\'s curse risk.'}</p></div>`:''}`;}

function controlChart(f){const s=f.scores;if(s.length<3)return '<p class="mu">Not enough matches.</p>';const m=avg(s),sd=Math.sqrt(avg(s.map(x=>(x-m)**2))),ucl=m+3*sd,lcl=m-3*sd;const W=520,H=170,p=30;const lo=Math.min(lcl,...s)-5,hi=Math.max(ucl,...s)+5;const x=i=>p+i/(s.length-1)*(W-p-10),y=v=>H-18-(v-lo)/(hi-lo)*(H-30);

<div class="card"><h4>Profit by round</h4>${hist.length?barChart(hist):'<p class="mu">No rounds played yet.</p>'}<p class="mu">Revenue to date ${fmt(f.rev)} Cr · Peak debt ${fmt(f.st.peakDebt)} Cr · Interest accrued ${fmt(f.st.intPaid)} Cr</p></div></div>
<div class="card"><div class="row sp"><h4>Ledger (every money movement, tagged by concept)</h4><select data-c="lt">${tags.map(t=>`<option ${U.lt===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="tw" style="max-height:420px;overflow:auto"><table><tr><th>When</th><th>Item</th><th>Tag</th><th>Account</th><th class="right">Amount</th></tr>${L.map(e=>`<tr><td><small>S${e.s||1} ${e.r?'R'+e.r:e.ph||''}</small></td><td>${esc(e.l)}</td><td><span class="tag">${e.t}</span></td><td><small>${{purse:'Purse',cash:'Cash',int:'Interest payable'}[e.k]}</small></td><td class="right num ${e.a<0?'red':e.a>0?'ac':''}">${e.a?fmt(e.a):'—'}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">No entries</td></tr>'}</table></div></div>`;}
function barChart(h){const W=520,H=150,p=26;const mx=Math.max(1,...h.map(x=>Math.abs(x.p)));const bw=(W-p)/h.length;const y0=H/2;return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${p}" x2="${W}" y1="${y0}" y2="${y0}" stroke="#ffffff22"/>${h.map((x,i)=>{const hh=Math.abs(x.p)/mx*(H/2-12);return `<rect x="${p+i*bw+2}" y="${x.p>=0?y0-hh:y0}" width="${bw-4}" height="${hh}" rx="3" fill="${x.p>=0?'#3ee6a8':'#ff5d73'}"><title>R${x.r}: ${fmt(x.p)} Cr</title></rect><text x="${p+i*bw+bw/2-6}" y="${H-2}">${x.r}</text>`;}).join('')}<text x="0" y="12">${fmt(mx,1)}</text></svg>`;}
/* ===================== TABLE / FIXTURES / SPONSORS / NEWS ===================== */
function vTable(f){const st=standings();return `<div class="card tw"><h4>Points table · top 4 qualify</h4><table><tr><th>#</th><th>Franchise</th><th>P</th><th>W</th><th>L</th><th>NR</th><th>Pts</th><th data-tip="Replaces net run rate for tie breaks">Impact margin</th><th>Form</th><th>Brand</th><th>Rep</th><th>Debt</th><th>Stance</th></tr>${st.map((t,i)=>`<tr class="${t.id===f.id?'me':''} ${i===3?'cut':''}"><td>${i+1}</td><td>${tname(t)}${t.isHuman?' <small>(you)</small>':''}</td><td>${t.w+t.l+t.nr}</td><td>${t.w}</td><td>${t.l}</td><td>${t.nr}</td><td><b>${t.pts}</b></td><td class="num">${fmt(t.margin,1)}</td><td>${t.res.slice(-5).map(x=>`<span class="${x==='W'?'ac':'red'}">${x}</span>`).join('')}</td><td>${Math.round(t.brand)}</td><td>${Math.round(t.rep)}</td><td class="num">${fmt(debt(t))}</td><td><small>${t.stance?STANCES[t.stance].n:''}</small></td></tr>`).join('')}</table><p class="mu mt">Tie breaks: points, impact margin, head to head, lower debt.</p></div>`;}
function vFixtures(f){return `<div class="card"><h4>Fixtures · double round robin (${G.R} rounds)</h4><div class="g g3">${G.fixtures.map((ms,i)=>{const r=i+1,res=G.results.find(x=>x.r===r);return `<div class="bm"><h4>Round ${r}${r===G.round&&G.phase==='LEAGUE'?' · now':''}${r===G.mid?' · trade window after':''}</h4>${ms.map((m,j)=>{const x=res&&res.ms[j];const mine=m.h===f.id||m.a===f.id;return `<div class="row sp" style="${mine?'color:var(--ac)':''};${x?'cursor:pointer':''}" ${x?`data-a="match" data-v="R${r}|${m.h}|${m.a}"`:''}><span>${tchip(T(m.h))} v ${tchip(T(m.a))}</span><small>${x?(x.rain?'rain':`${T(x.w).code} +${fmt(x.mg,1)}`):T(m.h).homePitch}</small></div>`;}).join('')}</div>`;}).join('')}</div></div>`;}
function sponsProgress(f,s){switch(s.k){case'NOVA':return `Position #${standings().findIndex(t=>t.id===f.id)+1} (top 4 needed)`;case'VOLT':{let n=0;for(let i=f.res.length-1;i>=0&&f.res[i]==='L';i--)n++;return `Current losing streak ${n} (exit at 4)`;}case'SAHYOG':return `Avg local players in XI ${f.localN?fmt(f.localSum/f.localN,1):'—'} (need 3, bonus at 5)`;case'CHRONOS':return `STARs owned ${sq(f).filter(p=>p.bcg==='STAR').length} (need 3 at round ${G.mid})`;case'LEARN':{const m=Math.max(0,...Object.values(f.qmApps));return `Most QM appearances ${m} (need 10)`;}case'GREEN':return `Price limit ₹2,000 · current ₹${f.price}`;}return '';}
function vSponsors(f){return `<div class="card mb"><h4>Active contracts (${activeSpons(f).length}/3)</h4>${f.spons.length?`<div class="tw"><table><tr><th>Sponsor</th><th>Fee</th><th>Paid</th><th>Left</th><th>Condition</th><th>Progress</th><th>Status</th></tr>${f.spons.map(s=>`<tr><td><b>${SPONS[s.k].n}</b> <small>${SPONS[s.k].k}</small></td><td>${fmt(s.fee)}</td><td>${fmt(s.paid)}</td><td>${s.left} rds</td><td><small>${SPONS[s.k].cond}</small></td><td><small>${s.act?sponsProgress(f,s):''}</small></td><td>${s.act?'<span class="tag ok">Active</span>':'<span class="tag bad">Exited</span>'} <small>${esc(s.note)}</small></td></tr>`).join('')}</table></div>`:'<p class="mu">No sponsors signed.</p>'}</div>${f.offers.length&&G.phase!=='RESULTS'?`<div class="card"><h4>Open offers</h4>${offerCards(f)}</div>`:''}`;}
function vNews(f){const pend=pendCards();const ns=G.news.filter(n=>!U.newsMine||n.f===f.id||n.f==null);return `${pend}<div class="card"><div class="row sp"><h4>News feed</h4><label class="tog"><input type="checkbox" data-c="newsMine" ${U.newsMine?'checked':''}> Only mine + league</label></div>${ns.map(n=>`<div class="news"><span class="r">S${n.s} ${n.r?'R'+n.r:n.ph.slice(0,4)}</span><div>${n.f!=null?tchip(T(n.f))+' ':''}<b>${esc(n.t)}</b> ${n.c?`<span class="tag">${esc(n.c)}</span>`:''}${n.x?`<div class="x">💡 ${esc(n.x)}</div>`:''}</div></div>`).join('')}</div>`;}
/* ===================== DEBUG (hidden: Ctrl+Shift+D or ?debug) ===================== */
function dbg(f){return `<div class="dbg"><b>🛠 Debug mode</b><button class="btn sm" data-a="dbgAdv">Advance</button><button class="btn sm" data-a="dbgAuc">Finish auction</button><button class="btn sm" data-a="dbgCash">+10 Cr cash</button><button class="btn sm" data-a="dbgPurse">+10 Cr purse</button><button class="btn sm" data-a="dbgPlayer">+ Player</button><select id="dbgEv">${GEV.map(e=>`<option value="g:${e.id}">G: ${e.n}</option>`).join('')}${TEV.map(e=>`<option value="t:${e.id}">T: ${e.n}</option>`).join('')}</select><button class="btn sm" data-a="dbgEv">Trigger</button><button class="btn sm" data-a="dbgTests">Acceptance tests</button><button class="btn sm" data-a="dbgState">View state</button><button class="btn sm" data-a="dbgAuto">Auto-play to end</button></div>`;}
/* ===================== ACTIONS ===================== */
const A={};const ME=()=>me();
A.tab=v=>{U.tab=v;render();window.scrollTo(0,0);};
A.closeModal=(v,el,e)=>{if(e.target!==el&&!el.classList.contains('x'))return;U.modal=null;render();};
A.save=()=>toast(saveGame()?'Game saved to this browser':'Could not save (storage blocked)',saveGame()?'ok':'err');
A.menu=()=>modal(`<h2>Menu</h2><div class="g g2"><button class="btn" data-a="exportS">Export save (JSON)</button><button class="btn" data-a="import">Import save</button><button class="btn" data-a="newgame">New game</button><button class="btn" data-a="help">Concept glossary</button></div><p class="mu mt">The game auto-saves after every phase, lot and round. Debug mode: Ctrl+Shift+D.</p>`);
A.help=()=>modal(`<h2>Concepts in play</h2><table>${[['Porter\'s Generic Strategies','Stance choice'],['SWOT','Hidden SWOT card'],['BCG Matrix','Player portfolio tags'],["Prisoner's Dilemma",'Non-compete pacts'],['Theory of Constraints','Bottleneck unit and constraint factor'],['Capital budgeting','120 Cr purse'],['Fair value','Fair Value and Franchise Valuation'],['Portfolio theory','μ as return, σ as risk, CV'],['Leverage and covenants','Loan tiers, DSCR, default seizure'],['Options','RTM premium and expiry'],['Hedging','Injury insurance'],['Equity vs debt','Equity investor offer'],['Sunk cost fallacy','Release rules and nudge'],["Winner's curse",'Hidden stats, overpay metric'],['Information asymmetry','Rating bands and scouting'],['Auction theory','English vs sealed first price vs Vickrey'],['Supply and demand','Scarcity factor'],['Inflation','Auction CPI, Inflation Spike'],['Price elasticity','Ticket demand curve'],['STP','Fan segment and engagement'],['Brand equity','brandIndex'],['Sponsorship contracts','Conditional deals'],['Herzberg two factor theory','Morale triggers'],['Leadership styles','Captain styles'],['Attrition and retention','Release requests'],['Succession planning','Academy and succession flag'],['Capacity management','Stamina and fatigue'],['Inventory management','Carrying cost and stockouts'],['Six Sigma','Reliable badge, control chart, Quality Award'],['Negotiation and BATNA','Trade window']].map(([a,b])=>`<tr><td><b>${a}</b></td><td>${b}</td></tr>`).join('')}</table>`);
A.exportS=()=>{const b=new Blob([JSON.stringify(G)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`franchise-cfo-${G.seed}-S${G.season}.json`;a.click();};
A.import=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{if(loadGame(r.result)){U.modal=null;U.tab='play';saveGame();render();toast('Save imported','ok');}else toast('That file is not a valid save','err');};r.readAsText(i.files[0]);};i.click();};
A.newgame=()=>{if(G&&G.phase!=='RESULTS'&&!confirm('Abandon the current game? (It stays saved until a new game starts.)'))return;G=null;U.modal=null;U.tab='play';render();};
A.su_h=v=>{U.setup.humans=+v;render();};A.su_d=v=>{U.setup.diff=v;render();};A.su_v=v=>{U.setup.vickrey=v==='1';render();};
A.su_teams=v=>{U.setup.teams=+v;U.setup.picks=U.setup.picks.map((p,i)=>p<+v?p:i);render();};A.su_pick=(v,el)=>{U.setup.picks[+el.dataset.i]=+v;};A.su_seed=v=>{U.setup.seed=v.trim();};
A.start=()=>{const s=U.setup;const picks=s.picks.slice(0,s.humans);if(new Set(picks).size!==picks.length)return toast('Each human needs a different franchise','err');const seed=s.seed||String(Math.floor(Math.random()*1e6));newGame({teams:s.teams,humans:picks,seed,diff:s.diff,vickrey:s.vickrey});U.ah=picks[0]!=null?picks[0]:0;U.tab='play';U.ret={};saveGame();render();};
A.continue=()=>{if(loadGame()){U.tab='play';U.lastPhase=G.phase;render();toast('Welcome back','ok');}else toast('No valid save found','err');};
A.replay=()=>{const hs=humans().map(h=>h.id);newGame({teams:G.teams.length,humans:hs,seed:G.seed,diff:G.diff,vickrey:G.vickrey});U.tab='play';render();};
A.switch=v=>{U.ah=+v;render();};
A.stance=v=>done(setStance(ME(),v));A.focus=v=>done(setStance(ME(),'FOCUS',v));A.seg=v=>done(setSegment(ME(),v));A.rtm=()=>done(buyRTM(ME()));A.insN=v=>{ME().insN=+v;render();};
A.sign=v=>done(signSponsor(ME(),v));A.decline=v=>{declineOffer(ME(),v);render();};
A.confirmStrat=()=>{const f=ME();const w=confirmStrategy(f);if(w)return toast(w,'err');U.tab='play';render();if(G.phase==='AUCTION')toast('All strategies locked. Welcome to the auction room!','ok');};
A.speed=v=>{U.speed=+v;render();};A.pause=()=>{U.paused=!U.paused;render();};
A.skipLot=()=>{skipLot();render();};A.skipSet=()=>{skipSet();render();};A.startSet=()=>{G.au.t=0;auTimeout();render();};
A.autobid=(v,el)=>{ME().auto=el.checked;render();};
A.bid=v=>{const w=humanBid(+v);if(w)toast(w,'err');render();};
A.seal=v=>{const el=$('#seal'+v);const w=humanSealed(+v,el&&el.value!==''?+el.value:NaN);if(w)toast(w,'err');render();};A.sealPass=v=>{humanSealed(+v,null);render();};
A.scout=v=>{const w=doScout(ME(),v);if(w)toast(w,'err');else toast(`Scouting report: μ ${P(v).mu}, σ ${P(v).sigma}, injury ${P(v).inj} · Fair Value ${fmt(trueFV(P(v)))} Cr`,'ok');render();};
A.pact=v=>{const b=+$('#pactBot').value;const r=proposePact(ME().id,b,v);toast(r==='ok'?`${T(b).name} accepted the non-compete pact`:r,r==='ok'?'ok':'err');render();};
A.loan1=()=>{const f=ME();let w=drawLoan(f,1,1);if(w)w=drawLoan(f,2,1)?w:'';done(w,w?'':'1 Cr loan drawn into purse');};
A.rtmY=v=>{const w=rtmDecide(+v,true);if(w)toast(w,'err');render();};A.rtmN=v=>{rtmDecide(+v,false);render();};
A.captain=v=>done(setCaptain(ME(),v,null));A.capt=v=>done(setCaptain(ME(),v,null));A.style=v=>done(setCaptain(ME(),null,v));A.styleSel=v=>done(setCaptain(ME(),null,v));A.pitch=v=>done(setPitch(ME(),v));A.academy=()=>done(buyAcademy(ME()));A.insure=v=>done(insure(ME(),P(v)));
A.startSeason=()=>{const f=ME();if(!f.captain||!f.style){}const w=startSeason();if(w)return toast(w,'err');U.tab='play';done('',`Season underway: round 1`);};
A.xi=(v,el)=>{const f=ME();if(el.checked){if(f.xi.length>=11){toast('XI already has 11: untick someone first','err');}else if(!f.xi.includes(v))f.xi.push(v);}else f.xi=f.xi.filter(x=>x!==v);render();};
A.autoXI=()=>{const f=ME();f.xi=autoPick(f,nextPitch(f));done('','Auto-picked the best valid XI (resting stamina < 40 where possible)');};A.clearXI=()=>{ME().xi=[];render();};
A.release=v=>{const p=P(v);modal(`<h3>Release ${esc(p.name)}?</h3><p>The ${fmt(p.pricePaid)} Cr you paid is <b>sunk</b>: it is never refunded. You save future carrying cost and morale drag.</p><p class="mu">Is this decision about what he will do next, or what you paid?</p><button class="btn warn" data-a="releaseGo" data-v="${v}">Release</button>`);};
A.releaseGo=v=>{U.modal=null;done(release(ME(),v),'Released to the free agent pool');};
A.price=(v)=>{const f=ME();f.price=+v;render();};
A.play=()=>{const w=playRound();if(w)return toast(w,'err');const f=ME();const mm=G.results[G.results.length-1].ms.find(m=>m.h===f.id||m.a===f.id);if(mm&&!mm.rain)toast(mm.w===f.id?`Win! ${f.name} by ${fmt(mm.mg,1)}`:`Defeat by ${fmt(mm.mg,1)}`,mm.w===f.id?'ok':'err');saveGame();render();};
A.advance=()=>{advance();U.tab='play';saveGame();render();window.scrollTo(0,0);};
A.pend=v=>{const[id,k]=v.split(':');done(resolvePend(+id,k));};
A.match=v=>{const[lab,h,a]=v.split('|');let m=null;G.results.forEach(r=>r.ms.forEach(x=>{if(x.lab===lab&&x.h===+h&&x.a===+a)m=x;}));if(G.po)G.po.ms.forEach(x=>{if(x.lab===lab&&x.h===+h&&x.a===+a)m=x;});if(m){U.modal=()=>matchDetail(m,ME());render();}};
A.scorecard=(v,el)=>{U.scorecard=el.checked;render();};
A.borrow=v=>{const a=+$('#loanAmt').value;done(drawLoan(ME(),+v,a),`${a} Cr drawn (tier ${v})`);};A.repay=()=>{const a=+$('#repAmt').value;done(repay(ME(),a),'Loan repaid');};A.lt=v=>{U.lt=v;render();};
A.tdTo=v=>{U.td={to:+v,give:[],get:[],cash:0,type:U.td.type};render();};A.tdType=v=>{U.td.type=v;render();};A.tdCash=v=>{U.td.cash=+v||0;render();};
A.tdp=(v,el)=>{const k=el.dataset.k;const a=U.td[k];if(el.checked){if(!a.includes(v))a.push(v);}else U.td[k]=a.filter(x=>x!==v);render();};
A.propose=()=>{const f=ME(),td=U.td;const r=proposeDeal({from:f.id,to:td.to,give:td.give.slice(),get:td.get.slice(),cash:+td.cash||0,type:td.type});if(r.err)return toast(r.err,'err');toast(r.msg,r.ok?'ok':'info');if(r.ok)U.td={to:td.to,give:[],get:[],cash:0,type:td.type};saveGame();render();};
A.dAcc=v=>{const r=respondDeal(+v,'accept');toast(r.err||r.msg,r.err?'err':'ok');saveGame();render();};A.dRej=v=>{respondDeal(+v,'reject');render();};
A.dCtr=v=>{const el=$('#ctr'+v);if(!el||el.value==='')return toast('Enter the cash amount for your counter','err');const r=respondDeal(+v,'counter',+el.value);toast(r.err||r.msg,r.err?'err':r.ok?'ok':'info');saveGame();render();};
A.signFA=v=>done(signFA(ME(),v),'Free agent signed');A.sellFA=v=>done(sellToFA(ME(),P(v)),'Sold to the free agent pool');
A.closeTrade=()=>{closeTrade();U.tab='play';saveGame();render();};
A.po=()=>{const w=playPlayoff();if(w)toast(w,'err');saveGame();render();};A.final=()=>{finalize();saveGame();render();window.scrollTo(0,0);};
A.rt=v=>{U.rt=+v;render();};A.newsMine=(v,el)=>{U.newsMine=el.checked;render();};
A.ret=(v,el)=>{const t=+el.dataset.t;const r=U.ret[t]||(U.ret[t]=[]);if(el.checked){if(r.length>=C.retentionMax){toast('Max 4 retentions','err');}else r.push(v);}else U.ret[t]=r.filter(x=>x!==v);render();};
A.nextSeason=()=>{newSeason(U.ret);U.ret={};U.tab='play';saveGame();render();toast(`Season ${G.season} begins`,'ok');};
A.dbgAdv=()=>{if(G.phase==='LEAGUE'){if(G.rs==='plan'){G.pend.slice().forEach(x=>resolvePend(x.id,x.opts[0][0]));G.teams.filter(isHumanCtl).forEach(f=>{if(xiWhy(f,f.xi))f.xi=autoPick(f);});playRound();}else advance();}else if(G.phase==='TRADE')closeTrade();else if(G.phase==='PLAYOFFS'){G.po.i<4?playPlayoff():finalize();}else if(G.phase==='PRESEASON'){G.teams.filter(isHumanCtl).forEach(f=>{if(!f.captain||!f.style)botPreseason(f);});startSeason();}else if(G.phase==='STRATEGY'){G.teams.filter(t=>!t.ready).forEach(t=>{t.auto=true;botStrategy(t);t.auto=false;});startAuction();}saveGame();render();};
A.dbgAuc=()=>{if(G.phase!=='AUCTION')return toast('Not in auction','err');auFast(()=>false,400000);render();};
A.dbgCash=()=>{post(ME(),'cash',10,'FINANCING','DEBUG: +10 Cr cash');render();};A.dbgPurse=()=>{post(ME(),'purse',10,'FINANCING','DEBUG: +10 Cr purse');render();};
A.dbgPlayer=()=>{const f=ME();if(f.sq.length>=C.squadMax)return toast('Squad full','err');const p=genPlayer();p.owner=f.id;p.pricePaid=p.basePrice;f.sq.push(p.id);retagAll();toast('Added '+p.name,'ok');render();};
A.dbgEv=()=>{const[k,id]=$('#dbgEv').value.split(':');if(!G.round&&k==='g'&&id==='RAIN')return toast('Rain needs an active round','err');if(k==='g')applyGlobal(id);else applyTeamEvent(ME(),id);render();};
A.dbgTests=()=>{const r=runTests();const d=determinismTest(G.seed);modal(`<h2>Acceptance tests (Section 14.7)</h2><table>${r.map(x=>`<tr><td>${x[1]?'✅':'❌'}</td><td>${x[0]}</td><td>${x[2]}</td><td>expected ${x[3]}</td></tr>`).join('')}<tr><td>${d.same?'✅':'❌'}</td><td>Same seed + scripted decisions → identical final standings</td><td colspan="2">${d.same?'identical':'DIFFERENT'}</td></tr></table>`);};
A.dbgState=()=>modal(`<h3>Game state</h3><pre>${esc(JSON.stringify(G,(k,v)=>k==='ledger'||k==='news'?`[${v.length} entries]`:v,1).slice(0,200000))}</pre>`);
A.dbgAuto=()=>{G.teams.forEach(f=>f.auto=true);autoSeason();G.teams.forEach(f=>f.auto=false);saveGame();render();};
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-fast]');if(!el||el.disabled||e.button)return;e.preventDefault();A[el.dataset.a](el.dataset.v,el,e);});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;if(el.dataset.fast&&e.detail)return;const fn=A[el.dataset.a];if(fn){if(el.tagName==='A')e.preventDefault();fn(el.dataset.v,el,e);}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&A[el.dataset.c])A[el.dataset.c](el.value,el,e);});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='prange'){const f=ME();f.price=+el.value;const pv=$('#pv');if(pv)pv.textContent='₹'+(+el.value).toLocaleString('en-IN');}});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&(e.key==='D'||e.key==='d')){U.debug=!U.debug;e.preventDefault();render();return;}if(e.key==='Escape'&&U.modal){U.modal=null;render();return;}
if(e.code==='Space'&&G&&G.phase==='AUCTION'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();const f=ME();if(f&&f.isHuman){const w=humanBid(f.id);if(w)toast(w,'err');render();}}});
/* ===================== AUCTION CLOCK ===================== */
setInterval(()=>{if(!G||G.phase!=='AUCTION'||U.paused||U.modal)return;const ph=G.phase;auTick(0.1*U.speed);if(G.ev!==U.lastEv||G.phase!==ph){if(G.au&&G.au.stage==='sold')saveGame();render();}else updTimer();},100);
render();

</script>
</body></html>
